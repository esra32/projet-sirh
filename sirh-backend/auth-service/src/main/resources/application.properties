spring.application.name=auth-service
server.port=8081

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sirh_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
# JWT
app.security.jwt.secret=${JWT_SECRET:change-me-to-a-very-long-secret-key-min-256-bits}
app.security.jwt.access-validity-ms=${JWT_ACCESS_MS:900000}
app.security.jwt.refresh-validity-ms=${JWT_REFRESH_MS:259200000}

# Keycloak JWT validation (optional)
keycloak.jwks-uri=${KEYCLOAK_JWKS_URI:http://localhost:8084/realms/myrealm/protocol/openid-connect/certs}
keycloak.issuer=${KEYCLOAK_ISSUER:http://localhost:8084/realms/myrealm}

# Keycloak Admin API (optional - required for RH admin user provisioning)
keycloak.admin.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:${KEYCLOAK_URL:}}
keycloak.admin.realm=${KEYCLOAK_REALM:sirh}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html