server:
  port: 8081
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sirh_auth
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
app:
  security:
    jwt:
      secret: change-me-to-a-very-long-secret-key-min-256-bits
      access-validity-ms: 900000
      refresh-validity-ms: 259200000
keycloak:
  jwks-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8084/realms/myrealm/protocol/openid-connect/certs}
  issuer: ${KEYCLOAK_ISSUER:http://localhost:8084/realms/myrealm}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
