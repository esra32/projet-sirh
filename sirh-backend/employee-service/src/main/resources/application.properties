spring.application.name=employee-service
server.port=8082

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sirh_employee?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
# JWT (for resource-server validation)
app.security.jwt.secret=${JWT_SECRET:change-me-to-a-very-long-secret-key-min-256-bits}

# Keycloak JWT validation (optional)
keycloak.jwks-uri=${KEYCLOAK_JWKS_URI:}
keycloak.issuer=${KEYCLOAK_ISSUER:}

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Mail (optionnel — si absent les emails sont loggués en console)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:noreply@sirh.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true