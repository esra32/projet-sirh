spring.application.name=recruitment-service
server.port=8083

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sirh_recruitment?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# JWT
app.security.jwt.secret=${JWT_SECRET:change-me-to-a-very-long-secret-key-min-256-bits}

# Keycloak JWT validation (optional)
keycloak.jwks-uri=${KEYCLOAK_JWKS_URI:}
keycloak.issuer=${KEYCLOAK_ISSUER:}

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Gemini (optional AI skill extraction)
gemini.apiKey=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# Jackson — dates en ISO 8601, champs inconnus ignorés
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Adzuna Market Intelligence
adzuna.app_id=${ADZUNA_APP_ID:1aaf1abd}
adzuna.app_key=${ADZUNA_APP_KEY:474aa93ef1333183b4e3fff0177a3988}
adzuna.country=fr