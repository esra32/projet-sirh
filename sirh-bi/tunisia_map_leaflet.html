<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte Tunisie Recrutements</title>
  <link rel="stylesheet" href="/static/assets/leaflet.css"/>
  <script src="/static/assets/leaflet.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: #f7fbfd; font-family: Arial, sans-serif; }
    #map { width:100%; height:100vh; }
    .legend {
      background: white;
      padding: 14px 18px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.13);
      font-size: 13px;
      line-height: 1.7;
    }
    .legend h4 { margin-bottom: 8px; color: #1e2f43; font-size:14px; }
    .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map', { zoomControl: true, scrollWheelZoom: true })
               .setView([35.5, 10.0], 7);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    
    L.circleMarker([36.8065, 10.1815], {
        radius: 29,
        fillColor: "#3266cc",
        color: "#ffffff",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.85
    }).bindPopup('<div style="font-family:Arial;font-size:13px;min-width:130px">Tunis<br><b>179 offres</b><br>Interne : 162<br>Externe : 17</div>')
      .addTo(map);

    L.circleMarker([35.8288, 10.6408], {
        radius: 24,
        fillColor: "#3266cc",
        color: "#ffffff",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.85
    }).bindPopup('<div style="font-family:Arial;font-size:13px;min-width:130px">Sousse<br><b>149 offres</b><br>Interne : 149<br></div>')
      .addTo(map);

    L.circleMarker([34.7406, 10.7603], {
        radius: 24,
        fillColor: "#3266cc",
        color: "#ffffff",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.85
    }).bindPopup('<div style="font-family:Arial;font-size:13px;min-width:130px">Sfax<br><b>149 offres</b><br>Interne : 145<br>Externe : 4</div>')
      .addTo(map);

    L.circleMarker([35.7643, 10.8113], {
        radius: 18,
        fillColor: "#3266cc",
        color: "#ffffff",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.85
    }).bindPopup('<div style="font-family:Arial;font-size:13px;min-width:130px">Monastir<br><b>110 offres</b><br>Interne : 110<br></div>')
      .addTo(map);

    L.circleMarker([36.7531, 10.2283], {
        radius: 12,
        fillColor: "#3266cc",
        color: "#ffffff",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.85
    }).bindPopup('<div style="font-family:Arial;font-size:13px;min-width:130px">Ben Arous<br><b>71 offres</b><br>Interne : 71<br></div>')
      .addTo(map);

    L.circleMarker([36.8625, 10.1947], {
        radius: 12,
        fillColor: "#3266cc",
        color: "#ffffff",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.85
    }).bindPopup('<div style="font-family:Arial;font-size:13px;min-width:130px">Ariana<br><b>66 offres</b><br>Interne : 66<br></div>')
      .addTo(map);

    L.circleMarker([36.2, 9.6], {
        radius: 14,
        fillColor: "#e4572e",
        color: "#ffffff",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.85
    }).bindPopup('<div style="font-family:Arial;font-size:13px;min-width:130px">Remote TN<br><b>84 offres</b><br>Externe : 84</div>')
      .addTo(map);

    // Legende
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function(map) {
      var div = L.DomUtil.create('div', 'legend');
      div.innerHTML = '<h4>Recrutements TN</h4>'
        + '<span class="dot" style="background:#3266cc"></span> Recrutement Interne<br>'
        + '<span class="dot" style="background:#e4572e"></span> Remote / Externe<br>'
        + '<br><b>808</b> offres localisees';
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
